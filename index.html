<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Attendance Portal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h2 {
      margin-top: 0;
      color: #1a1a1a;
      font-size: 22px;
      text-align: center;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    .optional-tag {
      font-weight: normal;
      color: #777;
      font-size: 12px;
    }
    input[type="text"], input[type="datetime-local"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccd0d5;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
      background-color: #fff;
    }
    .radio-group {
      display: flex;
      gap: 15px;
      margin-top: 5px;
      margin-bottom: 15px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      font-weight: normal;
      font-size: 15px;
      margin: 0;
      cursor: pointer;
    }
    .radio-group input[type="radio"] {
      margin-right: 6px;
      width: auto;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 18px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
    .status-msg {
      margin-top: 15px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      line-height: 1.4;
    }
    .session-info {
      background: #eaf3ff;
      border-left: 4px solid #0066cc;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- VIEW A: TEACHER GENERATOR -->
    <div id="teacherView" style="display: none;">
      <h2>Generate Attendance QR</h2>
      <label for="sheetInput">Google Sheet Link or ID</label>
      <input type="text" id="sheetInput" placeholder="Paste link or ID here">

      <label for="startTime">Open Time <span class="optional-tag">(Optional)</span></label>
      <input type="datetime-local" id="startTime">

      <label for="endTime">Close Time <span class="optional-tag">(Optional)</span></label>
      <input type="datetime-local" id="endTime">

      <button onclick="generateQR()">Create Classroom QR</button>

      <div id="qrResult" style="display: none;">
        <div id="qrcode"></div>
        <div class="session-info" id="windowInfo"></div>
      </div>
    </div>

    <!-- VIEW B: STUDENT SUBMISSION -->
    <div id="studentView" style="display: none;">
      <h2>Record Attendance</h2>
      <form id="attendanceForm">
        <label>Academic Year</label>
        <div class="radio-group">
          <label><input type="radio" name="year" value="Year 1" required> Year 1</label>
          <label><input type="radio" name="year" value="Year 2" required> Year 2</label>
          <label><input type="radio" name="year" value="Year 3" required> Year 3</label>
        </div>

        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" required placeholder="e.g. 20261045">

        <label for="name">Full Name (in ARABIC)</label>
        <input type="text" id="name" required placeholder="Full Name">

        <label>Select Group</label>
        <div class="radio-group">
          <label><input type="radio" name="group" value="Group A" required> Group A</label>
          <label><input type="radio" name="group" value="Group B" required> Group B</label>
        </div>

        <button type="submit" id="submitBtn">Submit Attendance</button>
      </form>
    </div>

    <p id="statusMsg" class="status-msg"></p>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYZpV_zuSR_ODAVSzQ0oa8c_cl7mKoFfY7v5WqsRATiTPL2aLlM7_hLqBFEanuzuz_UA/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const sheetId = urlParams.get("sheetId");
    const startMs = urlParams.get("start");
    const endMs = urlParams.get("end");

    let cachedCoords = { lat: null, lon: null };

    if (sheetId) {
      document.getElementById("studentView").style.display = "block";
      initStudentView();
    } else {
      document.getElementById("teacherView").style.display = "block";
    }

    function extractSheetId(input) {
      const match = input.match(/\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : input.trim();
    }

    function generateQR() {
      const input = document.getElementById("sheetInput").value.trim();
      const startVal = document.getElementById("startTime").value;
      const endVal = document.getElementById("endTime").value;

      if (!input) return alert("Please enter a Google Sheet URL or ID.");

      const cleanSheetId = extractSheetId(input);
      const cleanBaseUrl = window.location.origin + window.location.pathname;

      let studentUrl = `${cleanBaseUrl}?sheetId=${cleanSheetId}`;
      let windowText = "<b>Mode:</b> Always Open (No time limits)";

      if (startVal && endVal) {
        const sMs = new Date(startVal).getTime();
        const eMs = new Date(endVal).getTime();

        if (eMs <= sMs) return alert("Close time must be after Open time.");

        studentUrl += `&start=${sMs}&end=${eMs}`;
        windowText = `
          <b>Active Window:</b><br>
          🟢 Opens: ${new Date(sMs).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}<br>
          🔴 Closes: ${new Date(eMs).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}
        `;
      }

      const qrDiv = document.getElementById("qrcode");
      qrDiv.innerHTML = "";
      new QRCode(qrDiv, { text: studentUrl, width: 220, height: 220 });

      document.getElementById("windowInfo").innerHTML = windowText;
      document.getElementById("qrResult").style.display = "block";
    }

    function getDeviceUUID() {
      let uuid = localStorage.getItem("att_device_uuid");
      if (!uuid) {
        uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
        localStorage.setItem("att_device_uuid", uuid);
      }
      return uuid;
    }

    function getLiveCoordinates() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          return reject(new Error("Geolocation is not supported by your browser."));
        }
        navigator.geolocation.getCurrentPosition(
          pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
          err => {
            if (err.code === 1) {
              reject(new Error("Location permission denied. Please allow location access to submit attendance."));
            } else {
              reject(new Error("Unable to retrieve location. Please check your phone's GPS settings."));
            }
          },
          { timeout: 8000, enableHighAccuracy: true, maximumAge: 30000 }
        );
      });
    }

    function initStudentView() {
      const msg = document.getElementById("statusMsg");

      // Warm up GPS in background
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            cachedCoords.lat = pos.coords.latitude;
            cachedCoords.lon = pos.coords.longitude;
          },
          () => {},
          { timeout: 4000, enableHighAccuracy: false }
        );
      }

      // Time window checks
      if (startMs && endMs) {
        const now = Date.now();
        const s = parseInt(startMs, 10);
        const e = parseInt(endMs, 10);

        if (now < s) {
          msg.style.color = "#d9534f";
          msg.innerText = "Attendance is not open yet. Opens: " + new Date(s).toLocaleString();
          document.getElementById("submitBtn").disabled = true;
          return;
        } else if (now > e) {
          msg.style.color = "#d9534f";
          msg.innerText = "Attendance window has closed for this session.";
          document.getElementById("submitBtn").disabled = true;
          return;
        }
      }

      // Form submission handler
      document.getElementById("attendanceForm").addEventListener("submit", async ev => {
        ev.preventDefault();
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        msg.style.color = "#333";
        msg.innerText = "Verifying location...";

        let coords = cachedCoords;

        // Force location if not cached
        if (coords.lat === null || coords.lon === null) {
          try {
            coords = await getLiveCoordinates();
          } catch (locationErr) {
            msg.style.color = "#d9534f";
            msg.innerText = locationErr.message;
            submitBtn.disabled = false;
            return;
          }
        }

        msg.innerText = "Submitting attendance...";

        const payload = {
          sheetId: sheetId,
          startTime: startMs || "",
          endTime: endMs || "",
          year: document.querySelector('input[name="year"]:checked').value,
          studentId: document.getElementById("studentId").value.trim(),
          name: document.getElementById("name").value.trim(),
          group: document.querySelector('input[name="group"]:checked').value,
          latitude: coords.lat,
          longitude: coords.lon,
          deviceUuid: getDeviceUUID()
        };

        try {
          const data = await executePostWithRetry(payload);

          if (data.status === "success") {
            msg.style.color = "#28a745";
            msg.innerText = data.message;
            document.getElementById("attendanceForm").reset();
          } else {
            msg.style.color = "#d9534f";
            msg.innerText = data.message;
            submitBtn.disabled = false;
          }
        } catch (err) {
          msg.style.color = "#d9534f";
          msg.innerText = "Submission failed. Please verify your connection.";
          submitBtn.disabled = false;
        }
      });
    }

    async function executePostWithRetry(payload, retries = 1) {
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          const res = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();

          if (data.status === "busy" && attempt < retries) {
            await new Promise(resolve => setTimeout(resolve, 800));
            continue;
          }
          return data;
        } catch (error) {
          if (attempt === retries) throw error;
          await new Promise(resolve => setTimeout(resolve, 800));
        }
      }
    }
  </script>
</body>
</html>
