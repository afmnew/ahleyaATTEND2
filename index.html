<script>
  const APPS_SCRIPT_URL = "hhttps://script.google.com/macros/s/AKfycbyYZpV_zuSR_ODAVSzQ0oa8c_cl7mKoFfY7v5WqsRATiTPL2aLlM7_hLqBFEanuzuz_UA/exec";

  const urlParams = new URLSearchParams(window.location.search);
  const sheetId = urlParams.get("sheetId");
  const startMs = urlParams.get("start");
  const endMs = urlParams.get("end");

  let cachedCoords = { lat: null, lon: null };

  if (sheetId) {
    document.getElementById("studentView").style.display = "block";
    initStudentView();
  } else {
    document.getElementById("teacherView").style.display = "block";
  }

  function extractSheetId(input) {
    const match = input.match(/\/d\/([a-zA-Z0-9-_]+)/);
    return match ? match[1] : input.trim();
  }

  function generateQR() {
    const input = document.getElementById("sheetInput").value.trim();
    const startVal = document.getElementById("startTime").value;
    const endVal = document.getElementById("endTime").value;

    if (!input) return alert("Please enter a Google Sheet URL or ID.");

    const cleanSheetId = extractSheetId(input);
    const cleanBaseUrl = window.location.origin + window.location.pathname;

    let studentUrl = `${cleanBaseUrl}?sheetId=${cleanSheetId}`;
    let windowText = "<b>Mode:</b> Always Open (No time limits)";

    if (startVal && endVal) {
      const sMs = new Date(startVal).getTime();
      const eMs = new Date(endVal).getTime();

      if (eMs <= sMs) return alert("Close time must be after Open time.");

      studentUrl += `&start=${sMs}&end=${eMs}`;
      windowText = `
        <b>Active Window:</b><br>
        🟢 Opens: ${new Date(sMs).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}<br>
        🔴 Closes: ${new Date(eMs).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}
      `;
    }

    const qrDiv = document.getElementById("qrcode");
    qrDiv.innerHTML = "";
    new QRCode(qrDiv, { text: studentUrl, width: 220, height: 220 });

    document.getElementById("windowInfo").innerHTML = windowText;
    document.getElementById("qrResult").style.display = "block";
  }

  function getDeviceUUID() {
    let uuid = localStorage.getItem("att_device_uuid");
    if (!uuid) {
      uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
      localStorage.setItem("att_device_uuid", uuid);
    }
    return uuid;
  }

  // Helper promise to get fresh coordinates on demand
  function getLiveCoordinates() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        return reject(new Error("Geolocation is not supported by your browser."));
      }
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        err => {
          if (err.code === 1) {
            reject(new Error("Location permission denied. Please allow location access to submit attendance."));
          } else {
            reject(new Error("Unable to retrieve your location. Ensure GPS/Location is enabled on your device."));
          }
        },
        { timeout: 8000, enableHighAccuracy: true, maximumAge: 30000 }
      );
    });
  }

  function initStudentView() {
    const msg = document.getElementById("statusMsg");

    // Optional pre-warming
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          cachedCoords.lat = pos.coords.latitude;
          cachedCoords.lon = pos.coords.longitude;
        },
        () => {},
        { timeout: 4000, enableHighAccuracy: false }
      );
    }

    // Time window validation
    if (startMs && endMs) {
      const now = Date.now();
      const s = parseInt(startMs, 10);
      const e = parseInt(endMs, 10);

      if (now < s) {
        msg.style.color = "#d9534f";
        msg.innerText = "Attendance is not open yet. Opens: " + new Date(s).toLocaleString();
        document.getElementById("submitBtn").disabled = true;
        return;
      } else if (now > e) {
        msg.style.color = "#d9534f";
        msg.innerText = "Attendance window has closed for this session.";
        document.getElementById("submitBtn").disabled = true;
        return;
      }
    }

    // Form submission
    document.getElementById("attendanceForm").addEventListener("submit", async ev => {
      ev.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      msg.style.color = "#333";
      msg.innerText = "Verifying location...";

      let coords = cachedCoords;

      // Force location acquisition if not already cached
      if (coords.lat === null || coords.lon === null) {
        try {
          coords = await getLiveCoordinates();
        } catch (locationErr) {
          msg.style.color = "#d9534f";
          msg.innerText = locationErr.message;
          submitBtn.disabled = false;
          return;
        }
      }

      msg.innerText = "Submitting attendance...";

      const payload = {
        sheetId: sheetId,
        startTime: startMs || "",
        endTime: endMs || "",
        year: document.querySelector('input[name="year"]:checked').value,
        studentId: document.getElementById("studentId").value.trim(),
        name: document.getElementById("name").value.trim(),
        group: document.querySelector('input[name="group"]:checked').value,
        latitude: coords.lat,
        longitude: coords.lon,
        deviceUuid: getDeviceUUID()
      };

      try {
        const data = await executePostWithRetry(payload);

        if (data.status === "success") {
          msg.style.color = "#28a745";
          msg.innerText = data.message;
          document.getElementById("attendanceForm").reset();
        } else {
          msg.style.color = "#d9534f";
          msg.innerText = data.message;
          submitBtn.disabled = false;
        }
      } catch (err) {
        msg.style.color = "#d9534f";
        msg.innerText = "Submission failed. Please verify your connection.";
        submitBtn.disabled = false;
      }
    });
  }

  async function executePostWithRetry(payload, retries = 1) {
    for (let attempt = 0; attempt <= retries; attempt++) {
      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status === "busy" && attempt < retries) {
          await new Promise(resolve => setTimeout(resolve, 800));
          continue;
        }
        return data;
      } catch (error) {
        if (attempt === retries) throw error;
        await new Promise(resolve => setTimeout(resolve, 800));
      }
    }
  }
</script>
